# Configuration of the vulture-server container, mounted read-only at /etc/vulture/config.toml by
# deploy/docker-compose.yml. It holds no secrets: the Redis URL (with its password) comes from the environment
# (VULTURE__REDIS__URL, set by the compose file from REDIS_PASSWORD in your .env), and the access token lives in
# the data volume. Reference of every key: config.example.toml in the repository root.

[server]
# Inside the container the server must listen on all interfaces so that the published port works. The compose
# file publishes the ports to 127.0.0.1 of the host by default. Without [tls] the connection is plaintext, hence
# the flag. For TLS use config.docker.tls.toml with docker-compose.tls.yml instead (see deploy/README.md).
listen_addr = "0.0.0.0:50051"
allow_plaintext = true
data_dir = "/var/lib/vulture"

# TLS: use config.docker.tls.toml together with docker-compose.tls.yml (deploy/README.md, section TLS).

[metrics]
# Not authenticated. Published to the host's loopback by default; scrape it from a trusted network only.
listen_addr = "0.0.0.0:9100"

[logging]
level = "info"
format = "json"

[[exchanges]]
name = "binance"
enabled = true
symbols = []            # empty = every linear USDT/USDC perpetual
oi_poll_interval_secs = 30

# Optional exchanges. Uncomment and set enabled = true here, or (better) keep an untracked copy of this file, for
# example config.local.toml, and point VULTURE_CONFIG_FILE at it in .env. Both exchanges are public-data only (no keys).
#
# [[exchanges]]
# name = "bybit"
# enabled = false
# symbols = []            # empty = every linear USDT/USDC perpetual
# oi_poll_interval_secs = 30
#
# [[exchanges]]
# name = "okx"
# enabled = false
# symbols = []            # empty = every linear USDT/USDC swap
# oi_poll_interval_secs = 30

# Signals and alerts (V4a). The engine is on by default; with no channel configured it only writes Signal events
# into the stream. Rules and channels are set at runtime through Control and kept in /var/lib/vulture/alerts.json
# (mode 0600, may hold secrets). Reference: config.example.toml, section [alerts], and the README, "Signals and
# alerts". Put bot tokens and webhook URLs into files mounted read-only and reference them with secret_file, or
# into the environment (secret_env); do not write them into this file.
# [alerts]
# enabled = true
# warmup_secs = 14400
