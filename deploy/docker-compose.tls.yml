# TLS override for docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# It switches the server to config.docker.tls.toml, or to VULTURE_CONFIG_FILE when set (TLS enabled, plaintext off), mounts the certificate directory
# (VULTURE_TLS_DIR in .env, readable by VULTURE_UID:VULTURE_GID, 65532 by default; deploy/certbot maintains it) and publishes the gRPC port on
# VULTURE_GRPC_BIND, which defaults to all interfaces here because the port is encrypted. Open it in your firewall
# deliberately. Metrics stay on loopback unless VULTURE_METRICS_BIND says otherwise. Needs Docker Compose 2.24+
# (the !override tag).
services:
  vulture:
    volumes:
      - ${VULTURE_DATA_DIR:-./data}:/var/lib/vulture
      # VULTURE_CONFIG_FILE replaces the TLS config with your own (it must keep the [tls] section).
      - ${VULTURE_CONFIG_FILE:-./config.docker.tls.toml}:/etc/vulture/config.toml:ro
      - ${VULTURE_TLS_DIR:-./tls}:/etc/vulture/tls:ro
    ports: !override
      - "${VULTURE_GRPC_BIND:-0.0.0.0}:${VULTURE_GRPC_PORT:-50051}:50051"
      - "${VULTURE_METRICS_BIND:-127.0.0.1}:${VULTURE_METRICS_PORT:-9100}:9100"
