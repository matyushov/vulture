# Example alert rules for vulture-server. Thresholds are starting points; tune them to your deployment.
groups:
  - name: vulture
    rules:
      - alert: VultureDown
        expr: up{job="vulture"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "vulture-server is not scraped"

      - alert: VultureWriterBufferGrowing
        # Events pile up in memory because Redis does not accept them; above redis.buffer_limit the oldest are dropped.
        expr: vulture_redis_buffered_events > 1000 and deriv(vulture_redis_buffered_events[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Redis writer buffer is growing ({{ $value }} events)"

      - alert: VultureEventsDropped
        expr: increase(vulture_redis_dropped_total[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Events were dropped because the Redis buffer overflowed"

      - alert: VultureRedisWritesStalled
        # Connectors are healthy but nothing has reached Redis for a while.
        expr: vulture_redis_last_write_age_seconds > 300
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No successful Redis write for {{ $value | humanizeDuration }}"

      - alert: VultureConnectorDisconnected
        expr: vulture_ws_state{state="healthy"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.exchange }} WebSocket has not been healthy for 10 minutes"

      - alert: VultureMarkPriceStale
        expr: vulture_mark_price_age_seconds > 120
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.exchange }}: no mark price frames for {{ $value | humanizeDuration }}"

      - alert: VultureCertificateExpiring
        expr: vulture_tls_certificate_expiry_seconds < 14 * 24 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "TLS certificate expires in {{ $value | humanizeDuration }}; check the renewal"

      - alert: VultureCertificateReloadFailing
        expr: vulture_tls_last_reload_ok == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The last TLS certificate reload failed; the old certificate is still in use"

      - alert: VultureBinanceBanActive
        expr: vulture_rest_banned{exchange="binance"} == 1
        labels: {severity: critical}
        annotations:
          summary: "Binance REST is paused after an IP ban (HTTP 418); open interest has a gap"

      - alert: VultureBinanceThrottled
        expr: increase(vulture_rest_throttled_total{code="429"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Binance answered HTTP 429; the poller is slowing down"

      - alert: VultureStreamLag
        # The newest entry of the Redis stream is old although the writer is connected: no events are arriving.
        expr: vulture_redis_stream_newest_age_seconds > 120 and on() vulture_redis_connection_state{state="connected"} == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The newest event in Redis is {{ $value | humanizeDuration }} old"

      - alert: VultureRedisStreamSamplingFailing
        expr: increase(vulture_redis_stream_sample_errors_total[10m]) > 3
        labels: {severity: warning}
        annotations:
          summary: "Cannot sample the Redis stream length (Redis unreachable?)"

      - alert: VultureAuthFailures
        expr: increase(vulture_auth_failures_total[10m]) > 20
        labels: {severity: warning}
        annotations:
          summary: "Many failed authentication attempts ({{ $value }} in 10 minutes)"

  # History in ClickHouse (task V3a). These series exist only when [clickhouse] is configured and enabled.
  - name: vulture-history
    rules:
      - alert: VultureFlusherLagging
        # The flusher has not been able to confirm "everything is in ClickHouse" for 30 minutes (the regular cycle is
        # 10 minutes). Redis keeps the data meanwhile, but only until the MAXLEN safeguard.
        expr: vulture_flusher_watermark_lag_seconds > 1800
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The ClickHouse flusher is {{ $value | humanizeDuration }} behind"

      - alert: VultureClickHouseDown
        expr: vulture_flusher_clickhouse_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "ClickHouse is unreachable from vulture; history is piling up in Redis"

      - alert: VultureFlusherFailing
        # ClickHouse answers but inserts or migrations fail, or Redis state cannot be updated.
        expr: increase(vulture_flusher_failures_total[15m]) > 3 and on() vulture_flusher_clickhouse_up == 1
        labels: {severity: warning}
        annotations:
          summary: "The flusher keeps failing at stage {{ $labels.stage }} although ClickHouse answers"

      - alert: VultureFlusherBacklogNearLoss
        # The unflushed backlog approaches redis.maxlen_safeguard; beyond it the MAXLEN trim drops unflushed entries.
        expr: vulture_flusher_backlog_maxlen_ratio > 0.7
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The flusher backlog is {{ $value | humanizePercentage }} of redis.maxlen_safeguard: data loss is close"

      - alert: VultureFlusherWatermarkNearOldestEntry
        # How much already-flushed history Redis still holds before its oldest entry: the watermark time minus the
        # time of the oldest retained entry. Near zero means the trim has eaten all the flushed data and is closing
        # in on the unflushed part.
        expr: >-
          vulture_flusher_watermark_timestamp_seconds - (time() - vulture_redis_stream_oldest_age_seconds) < 600
          and vulture_redis_stream_oldest_age_seconds > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "The flush watermark is within 10 minutes of the oldest entry kept in Redis"

      - alert: VultureFlusherPossibleLoss
        expr: increase(vulture_flusher_possible_loss_total[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Unflushed entries were probably trimmed from Redis (MAXLEN safeguard); there is a hole in the history"

      - alert: VultureFlusherSkippedEntries
        expr: increase(vulture_flusher_skipped_entries_total[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Stream entries that could not be turned into rows were skipped (reason {{ $labels.reason }}); see the flusher log"

      - alert: VultureClickHouseDiskLow
        # Free space under 25%, or under an absolute floor (20 GiB). Merges temporarily need extra room, see deploy/README.md.
        expr: >-
          vulture_clickhouse_disk_free_bytes{disk="default"} / vulture_clickhouse_disk_total_bytes{disk="default"} < 0.25
          or vulture_clickhouse_disk_free_bytes{disk="default"} < 20 * 1024 * 1024 * 1024
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "The ClickHouse disk has less than 25% (or less than 20 GiB) free"

      - alert: VultureClickHouseDiskCritical
        expr: >-
          vulture_clickhouse_disk_free_bytes{disk="default"} / vulture_clickhouse_disk_total_bytes{disk="default"} < 0.10
          or vulture_clickhouse_disk_free_bytes{disk="default"} < 5 * 1024 * 1024 * 1024
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "ClickHouse disk is almost full; inserts and merges will fail"

      - alert: VultureClickHouseTooManyParts
        # ClickHouse delays inserts at 1000 parts in one partition and refuses at 3000; merges normally keep this small.
        expr: vulture_clickhouse_table_max_parts_per_partition > 300
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Table {{ $labels.table }} has {{ $value }} parts in one partition; merges are not keeping up"

      - alert: VultureClickHouseSamplingFailing
        expr: vulture_clickhouse_sample_age_seconds > 300
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "No fresh ClickHouse disk and table statistics for {{ $value | humanizeDuration }}"

  - name: vulture-history-api
    rules:
      - alert: VultureHistoryErrors
        # Internal errors and ClickHouse trouble seen by History callers (limits and bad requests do not count).
        expr: sum(rate(vulture_history_requests_total{code=~"internal|unavailable"}[10m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "History calls are failing ({{ $value | humanize }}/s with internal or unavailable); check ClickHouse and Redis"

      - alert: VultureHistoryClickHouseFallback
        expr: increase(vulture_history_redis_fallbacks_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "History answered from the Redis hot window because ClickHouse failed"

      - alert: VultureHistorySlow
        # The slowest call since start is a poor alert on its own; the mean over 15 minutes is the signal.
        expr: >-
          sum by (method) (rate(vulture_history_request_seconds_total[15m]))
          / clamp_min(sum by (method) (rate(vulture_history_requests_total[15m])), 1e-9) > 5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "History {{ $labels.method }} calls average {{ $value | humanize }} s"

      - alert: VultureHistoryRejectingCalls
        expr: sum(rate(vulture_history_rejections_total{reason="concurrency"}[10m])) > 0
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "History calls are refused for exceeding history.max_concurrent"

  - name: vulture-analysis
    rules:
      - alert: VultureDigestFailing
        expr: increase(vulture_alerts_digest_runs_total{result="failed"}[1d]) > 0
        labels: {severity: warning}
        annotations:
          summary: "The daily digest could not be built or sent (no channel, bad configuration); see the server log"

      - alert: VultureDigestMissing
        # The schedule is on (the next-run gauge exists) but no digest was queued for more than 26 hours.
        expr: >-
          (vulture_alerts_digest_last_success_age_seconds > 26 * 3600)
          and on() vulture_alerts_digest_next_run_timestamp_seconds
        labels: {severity: warning}
        annotations:
          summary: "No daily digest for {{ $value | humanizeDuration }} although the schedule is enabled"

      - alert: VultureCompositePassSlow
        expr: vulture_alerts_composite_pass_seconds_max > 0.5
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "A pass over all symbols and composite rules took {{ $value | humanizeDuration }}; check the number of rules and symbols"

      - alert: VultureFundingPollFailing
        # OKX funding rates and index prices come from REST polls every 5 minutes; all of them failing leaves the
        # samples without funding data (the rest of the data is not affected).
        expr: rate(vulture_funding_errors_total[30m]) > 0 and rate(vulture_funding_requests_total[30m]) > 0 and (rate(vulture_funding_errors_total[30m]) / rate(vulture_funding_requests_total[30m]) > 0.5)
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "More than half of the OKX funding/index requests fail"

