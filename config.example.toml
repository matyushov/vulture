# Example vulture-server configuration. A copy without secrets; do not commit the real config.
#
# Any value can be overridden from the environment: VULTURE__<SECTION>__<KEY>=value, for example
#   VULTURE__LOGGING__LEVEL=debug
#   VULTURE__REDIS__URL=redis://:password@host:6379     (secrets belong in the environment or a file)
#   VULTURE__EXCHANGES__0__ENABLED=false                (array elements are addressed by index)

[server]
listen_addr = "127.0.0.1:50051"  # gRPC. A non-loopback address needs [tls] (or allow_plaintext = true, see below)
# allow_plaintext = false         # accept a non-loopback bind without [tls]: the token travels unencrypted
# data_dir = "/var/lib/vulture"   # token, state.json (symbol policies), alerts.json (rules and channels), audit.log

# TLS for the gRPC listener. Uncomment to enable; paths are placeholders. The files are PEM; the certificate
# file may hold the whole chain (certbot's fullchain.pem). Certificate and key are reloaded without dropping open
# streams on SIGHUP and when the files change (poll below); an invalid replacement is rejected and the old
# certificate stays in use. Check the files with `vulture-server tls check --config <file>`.
# [tls]
# cert = "/etc/vulture/tls/fullchain.pem"
# key = "/etc/vulture/tls/privkey.pem"
# client_ca = "/etc/vulture/tls/client-ca.pem"   # enables mTLS: clients must present a certificate from this CA
#                                                # (read at start; changing it needs a restart)
# reload_interval_secs = 30      # poll the files' mtime and size; 0 disables polling (SIGHUP still reloads)

[redis]
# The URL may contain a password: prefer VULTURE__REDIS__URL or url_file over writing it here.
# url = "redis://127.0.0.1:6379"
# url_file = "/run/secrets/redis_url"

# One stream holds every event of every exchange (layout: README, "Redis storage").
stream_key = "vulture:events"
window_secs = 86400            # hot window; older entries are trimmed on every write (XTRIM MINID ~)
maxlen_safeguard = 5000000     # upper bound for the stream length (XTRIM MAXLEN ~), so Redis never fills up
batch_size = 500               # events per write pipeline, at most
flush_interval_ms = 50         # longest wait before a partial batch is written
buffer_limit = 100000          # events kept in memory while Redis is down; above it the oldest are dropped
                               # and one Gap event (exchange "*", stream "redis-writer") is written afterwards

# History in ClickHouse (optional). Without this section nothing is kept beyond the Redis window: the stream is
# trimmed by time only. With it, the flusher moves the stream to ClickHouse every flush_interval_secs and the
# Redis time trim never passes what has been flushed (the MAXLEN safeguard above still caps Redis memory).
# Apply the schema by hand with `vulture-server migrate --config <file>` (`run` does it at start as well).
# [clickhouse]
# enabled = true                   # false keeps the section but switches the flusher off
# url = "http://127.0.0.1:8123"    # HTTP(S) endpoint
# database = "vulture"             # created by the migrations if missing
# user = "default"
# password_file = "/run/secrets/clickhouse_password"   # or VULTURE__CLICKHOUSE__PASSWORD; never write it here
# flush_interval_secs = 600        # pause between flush cycles
# batch_max_rows = 100000          # stream entries per page and insert
# insert_timeout_secs = 60         # deadline of one insert or migration statement
# monitor_interval_secs = 60       # disk and table statistics sampling

# Limits of the History service (Query and Aggregate). The service is always on: with [clickhouse] it answers from
# ClickHouse plus the unflushed Redis tail, without it from the Redis hot window only. Defaults shown.
# [history]
# max_query_range_secs = 2678400       # longest period of one Query (31 days); Aggregate is bounded by max_bins
# default_limit = 10000                # events when the request says limit = 0
# max_rows = 1000000                   # a limit above this is refused (RESOURCE_EXHAUSTED); page with the cursor
# max_bins = 5000                      # bins per group of one Aggregate
# max_aggregate_rows = 200000          # groups x bins of one Aggregate answer
# max_fine_rows = 3000000              # (exchange, symbol, bin) cells read from ClickHouse for one Aggregate
# tail_max_entries = 2000000           # Redis entries one call may scan for the unflushed tail
# tail_page = 5000
# request_timeout_secs = 30            # deadline of a whole call
# max_concurrent = 8                   # simultaneous History calls
# clickhouse_max_memory_bytes = 2147483648
# movers_default_limit = 20
# movers_max_limit = 200
# movers_max_stale_secs = 900          # a series silent for longer is not a mover
# redis_slack_secs = 300               # Redis IDs are write times; period-to-ID slack for Redis-only reads

# The set of exchanges and symbols is data, not code. Symbols are normalized (BASE-QUOTE-PERP);
# an empty list means every linear USDT/USDC perpetual the exchange offers. `symbols` is the DEFAULT policy
# (empty = ALL, otherwise a whitelist): what the owner sets at runtime through Control.SetSymbolPolicy is kept in
# <data_dir>/state.json and overrides it from then on.
[[exchanges]]
name = "binance"
enabled = true
symbols = []
oi_poll_interval_secs = 30     # open interest snapshot per symbol; stretched automatically when too many symbols
# ws_url = "wss://fstream.binance.com/market/ws"   # defaults; override only for tests
# rest_url = "https://fapi.binance.com"

# Bybit linear perpetuals (USDT and USDC). Public data only. `symbols` is the default tracked-symbol policy as
# for Binance; per tracked symbol the server subscribes to allLiquidation.<symbol> and tickers.<symbol> on one
# WebSocket (more connections only for very large sets) and follows runtime policy changes without reconnecting.
# `oi_poll_interval_secs` is the interval of the open interest samples taken from the ticker stream.
[[exchanges]]
name = "bybit"
enabled = false
symbols = []
oi_poll_interval_secs = 30
# ws_url = "wss://stream.bybit.com/v5/public/linear"   # defaults; override only for tests
# rest_url = "https://api.bybit.com"

# OKX linear swaps (USDT and USDC margined). Public data only. `symbols` is the default tracked-symbol policy as
# above. One WebSocket carries the liquidation feed of all swaps (filtered here) plus the mark-price and open-interest
# channels of every tracked instrument; tracked-set changes are applied without reconnecting, in batches that respect
# OKX's 480 subscription requests per hour and connection.
# `oi_poll_interval_secs` is the interval of the open interest samples (taken from the latest pushes).
[[exchanges]]
name = "okx"
enabled = false
symbols = []
oi_poll_interval_secs = 30
# ws_url = "wss://ws.okx.com/ws/v5/public"   # defaults; override only for tests (port 443, not 8443)
# rest_url = "https://www.okx.com"

# Signals, rules and delivery (V4a). The analytics engine runs inside the server: it watches the event flow, writes
# `Signal` events (OI spikes up and down, liquidation cascades) into the same stream, and sends messages to
# Telegram and Discord according to the rules you set through Control. Rules and channels live in
# <data_dir>/alerts.json (mode 0600, may hold bot tokens: never commit it); the [[alerts.rules]] and
# [[alerts.channels]] entries below are only DEFAULTS that seed that file while it does not exist. A corrupt
# alerts.json stops the start. Reference: README, "Signals and alerts".
[alerts]
enabled = true
warmup_secs = 14400            # replay this much of the Redis stream at start (4 h = the longest OI window)
input_queue = 100000           # the engine's own input queue; when full it drops ITS input, never the writer's
max_symbols = 5000             # most symbols the engine tracks (about 15 KB each)
series_max_samples = 1024      # hard cap of OI samples per symbol (4 h at 30 s = 480)
sample_spacing_secs = 15       # samples closer than this to the previous one are ignored
hole_secs = 300                # a longer pause between two samples of a symbol is a hole; windows spanning it are skipped
composite_eval_secs = 10       # composite rules (set through Control.UpsertRule) are evaluated this often, from the engine state

[alerts.oi_spike]
enabled = true
min_oi_usd = 1000000.0         # symbols with less open interest than this are ignored (dust)
z_min = 4.0                    # the move must also be this many robust sigmas unusual for the symbol itself
min_baseline_points = 60       # earlier window changes needed to judge "unusual"
require_baseline = true        # no baseline, no signal
cooldown_secs = 900            # per exchange, symbol, window and direction
extension_factor = 1.5         # inside the cooldown a move that grows by this factor signals again
# Windows replace the whole default list when given. threshold_pct applies to |change of oi_base|.
# [[alerts.oi_spike.windows]]
# secs = 300
# threshold_pct = 3.0
# min_change_usd = 500000.0
# enabled = true

[alerts.liq_cascade]
enabled = true
per_exchange = true            # besides market-wide, detect on each exchange
baseline_secs = 86400          # per-minute notional of the previous day (median and MAD)
min_baseline_minutes = 120     # before this much baseline the trigger is 3 x floor
k_mad = 8.0                    # trigger: median + k x 1.4826 x MAD of the per-minute notional ...
floor_usd = 2000000.0          # ... and at least this much market-wide in the last 60 s
floor_usd_exchange = 1000000.0 # ... and at least this much on one exchange
min_count = 5                  # ... and at least this many liquidations
quiet_secs = 120               # a cascade ends after this long without being hot
end_ratio = 0.5                # hot = the last minute is at least this fraction of the trigger
top_symbols = 5                # symbols in the closing summary

[alerts.delivery]
telegram_base_url = "https://api.telegram.org"   # tests point it at a mock server
allow_custom_endpoints = false # accept Discord webhooks outside discord.com (tests only)
telegram_min_interval_ms = 1100  # at most about one message per second to a chat ...
telegram_max_per_minute = 20     # ... and 20 per minute (the group limit)
discord_min_interval_ms = 2000
discord_max_per_minute = 20
batch_window_ms = 3000         # alerts produced within this window are merged into one digest
digest_max_items = 12          # alerts listed in a digest; the rest are counted ("and N more")
queue_limit = 500              # alerts queued per channel; above it the oldest are dropped and summarized
retry_min_ms = 1000            # exponential backoff of failed messages
retry_max_ms = 60000
max_attempts = 8
request_timeout_secs = 10

# The daily digest: one summary message a day through the alert channels (top OI growth and decline, the largest
# liquidations, long versus short skew per exchange, cascades, funding extremes, data gaps), built from the History
# aggregate code. `Control.SendDigestNow` sends one on request whatever `enabled` says. Quiet hours do not apply to it.
# [alerts.digest]
# enabled = false
# time_utc = "07:00"           # HH:MM, UTC
# channels = []                # channel ids; empty = every enabled channel that is not a system channel
# sections = ["oi_movers", "liquidations", "skew", "cascades", "funding", "gaps"]
# top_n = 5                    # entries per list, 1 to 20

# Default channel and rule (seed for alerts.json). Secrets: prefer secret_env or secret_file; an inline `secret`
# would sit in this file. Remove the comment marks to use them.
# [[alerts.channels]]
# id = "telegram-main"
# name = "Main Telegram chat"
# kind = "telegram"            # or "discord" (then no chat_id, and the secret is the webhook URL)
# chat_id = "-1001234567890"
# secret_env = "VULTURE_TELEGRAM_TOKEN"   # or secret_file = "/run/secrets/telegram_token"
# dry_run = true               # log instead of sending until you have checked the rules
#
# [[alerts.rules]]
# id = "all-signals"
# name = "OI spikes and cascades"
# channels = ["telegram-main"]
# cooldown_secs = 0
# [alerts.rules.kind]
# type = "signal"              # also: "liquidation" (min_notional_usd, sides) and "oi_change" (window_secs, min_change_pct)
# min_severity = "info"

[metrics]
# /metrics (Prometheus), /healthz (process up), /readyz (Redis reachable and gRPC running). Not authenticated:
# keep it on loopback or an internal network, or put a reverse proxy in front.
listen_addr = "127.0.0.1:9100"

[logging]
level = "info"                 # tracing filter, e.g. "info,vulture_server::ws=debug"
format = "text"                # "text" or "json"

[normalize]
# base_aliases_file = "/etc/vulture/base_aliases.toml"   # replaces the built-in alias table
