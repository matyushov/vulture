# Example vulture-server configuration. A copy without secrets; do not commit the real config.
#
# Any value can be overridden from the environment: VULTURE__<SECTION>__<KEY>=value, for example
#   VULTURE__LOGGING__LEVEL=debug
#   VULTURE__REDIS__URL=redis://:password@host:6379     (secrets belong in the environment or a file)
#   VULTURE__EXCHANGES__0__ENABLED=false                (array elements are addressed by index)

[server]
listen_addr = "127.0.0.1:50051"  # gRPC. A non-loopback address is refused unless allow_plaintext = true
                               # (until TLS lands the bearer token would travel unencrypted)
allow_plaintext = false
data_dir = "/var/lib/vulture"  # the token (`token` file, mode 0600) and service state; created with mode 0700
shutdown_timeout_secs = 4      # upper bound for graceful shutdown
max_clients = 16               # simultaneous Stream.Subscribe clients
client_buffer = 1024           # events queued per client; a client whose queue stays full is disconnected
slow_client_timeout_ms = 10000 # ... after this long (RESOURCE_EXHAUSTED; it can resume with its last id)
keepalive_interval_secs = 30   # HTTP/2 keepalive ping
keepalive_timeout_secs = 10
token_check_interval_ms = 1000 # how often the token file is re-read (picks up `token rotate` from the CLI)

[tls]                          # not applied yet (V1-8); the server logs a warning if this section is present
cert = "/etc/vulture/tls/fullchain.pem"   # reloaded on SIGHUP
key = "/etc/vulture/tls/privkey.pem"
# client_ca = "/etc/vulture/tls/client-ca.pem"   # enables mTLS (optional)

[redis]
# The URL may contain a password: prefer VULTURE__REDIS__URL or url_file over writing it here.
# url = "redis://127.0.0.1:6379"
# url_file = "/run/secrets/redis_url"

# One stream holds every event of every exchange (layout: README, "Redis storage").
stream_key = "vulture:events"
window_secs = 86400            # hot window; older entries are trimmed on every write (XTRIM MINID ~)
maxlen_safeguard = 5000000     # upper bound for the stream length (XTRIM MAXLEN ~), so Redis never fills up
batch_size = 500               # events per write pipeline, at most
flush_interval_ms = 50         # longest wait before a partial batch is written
buffer_limit = 100000          # events kept in memory while Redis is down; above it the oldest are dropped
                               # and one Gap event (exchange "*", stream "redis-writer") is written afterwards

# The set of exchanges and symbols is data, not code. Symbols are normalized (BASE-QUOTE-PERP);
# an empty list means every linear USDT/USDC perpetual the exchange offers.
[[exchanges]]
name = "binance"
enabled = true
symbols = []
oi_poll_interval_secs = 30     # open interest snapshot per symbol; stretched automatically when too many symbols
# ws_url = "wss://fstream.binance.com/market/ws"   # defaults; override only for tests
# rest_url = "https://fapi.binance.com"

[[exchanges]]
name = "bybit"
enabled = false
oi_poll_interval_secs = 30

[[exchanges]]
name = "okx"
enabled = false
oi_poll_interval_secs = 30

[metrics]
listen = "127.0.0.1:9090"      # Prometheus, separate port

[logging]
level = "info"                 # tracing filter, e.g. "info,vulture_server::ws=debug"
format = "text"                # "text" or "json"

[normalize]
# base_aliases_file = "/etc/vulture/base_aliases.toml"   # replaces the built-in alias table
