version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Сервисы названы по роли (Stream, History, Control), без суффикса Service.
    - SERVICE_SUFFIX
    # Серверные стримы отдают общий Event, а не <Rpc>Response.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # History.Query принимает HistoryRequest.
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
