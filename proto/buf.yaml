version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Services are named by role (Stream, History, Control), without the Service suffix.
    - SERVICE_SUFFIX
    # Server streams return the shared Event, not <Rpc>Response.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # History.Query takes HistoryRequest.
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
