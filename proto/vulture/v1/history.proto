// History and aggregates. All calculations are performed by the server.
syntax = "proto3";

package vulture.v1;

import "vulture/v1/common.proto";

service History {
  // Events for a period (recent from Redis, older from ClickHouse, transparently). Pagination:
  // cursor = Event.id of the last received event, passed in HistoryRequest.cursor.
  rpc Query(HistoryRequest) returns (stream Event);
  // Aggregates by exchange, symbol or base asset with an hour/day/week/month step. With
  // AggregateRequest.oi_movers set it returns the open interest movers ranking instead (v0.2).
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);
}

message HistoryRequest {
  repeated string exchanges = 1;
  repeated string symbols = 2;
  repeated EventType types = 3;
  // Period bounds, ms, [from_ts, to_ts).
  int64 from_ts = 4;
  int64 to_ts = 5;
  // 0 = the server default limit.
  uint32 limit = 6;
  string cursor = 7;
  reserved 8 to 15;
}

enum GroupBy {
  GROUP_BY_UNSPECIFIED = 0;
  GROUP_BY_EXCHANGE = 1;
  GROUP_BY_SYMBOL = 2;
  GROUP_BY_BASE_ASSET = 3;
}

enum Step {
  STEP_UNSPECIFIED = 0;
  STEP_HOUR = 1;
  STEP_DAY = 2;
  STEP_WEEK = 3;
  STEP_MONTH = 4;
}

enum Metric {
  METRIC_UNSPECIFIED = 0;
  // Liquidations: USD sum and count.
  METRIC_LIQ_SUM_USD = 1;
  METRIC_LIQ_COUNT = 2;
  // Liquidations by side, USD.
  METRIC_LIQ_LONG_USD = 3;
  METRIC_LIQ_SHORT_USD = 4;
  // Largest liquidation, USD.
  METRIC_LIQ_MAX_USD = 5;
  // OI change over the step: in the base coin and in USD.
  METRIC_OI_CHANGE_BASE = 6;
  METRIC_OI_CHANGE_USD = 7;
  // Total OI per base asset (all exchanges), USD, at the end of the step.
  METRIC_OI_TOTAL_USD = 8;
  // Liquidations as a share of OI: liq_usd / oi_usd.
  METRIC_LIQ_TO_OI_RATIO = 9;
}

message AggregateRequest {
  GroupBy group_by = 1;
  Step step = 2;
  // Period, ms, [from_ts, to_ts).
  int64 from_ts = 3;
  int64 to_ts = 4;
  // Filters; an empty list = no filter.
  repeated string exchanges = 5;
  repeated string symbols = 6;
  repeated string base_assets = 7;
  repeated Metric metrics = 8;
  // v0.2: when set, the call returns the OI movers ranking in AggregateResponse.oi_movers and no
  // rows. group_by, step and metrics are ignored; from_ts is ignored; to_ts is the end of the
  // window (0 = now); exchanges and symbols filter the candidates.
  // (Numbers 9 to 15 stay reserved: shrinking a reserved range is a breaking change.)
  optional OiMoversQuery oi_movers = 16;
  reserved 9 to 15;
}

enum OiMoverSort {
  OI_MOVER_SORT_UNSPECIFIED = 0;
  // By change in percent (default).
  OI_MOVER_SORT_PCT = 1;
  // By absolute change of oi_base.
  OI_MOVER_SORT_ABS_BASE = 2;
}

// Ranking of open interest changes (oi_base, never oi_usd, so price moves do not show as spikes).
message OiMoversQuery {
  // Window length, seconds: oi_base at (to_ts - window) is compared with oi_base at to_ts.
  uint32 window_secs = 1;
  // Entries per list; 0 = the server default.
  uint32 limit = 2;
  OiMoverSort sort_by = 3;
  // Ignore symbols whose current OI is below this many USD (noise filter); 0 = no filter.
  double min_oi_usd = 4;
  reserved 5 to 9;
}

message OiMover {
  string exchange = 1;
  // Normalized symbol.
  string symbol = 2;
  // oi_base at the start and at the end of the window.
  double oi_base_start = 3;
  double oi_base_end = 4;
  // oi_base_end - oi_base_start, base units.
  double change_abs = 5;
  // Percent of oi_base_start.
  double change_pct = 6;
  // Current OI in USD, if known.
  optional double oi_usd_end = 7;
  // The window overlaps a Gap or has too few samples: the change is an estimate.
  bool partial = 8;
  reserved 9 to 15;
}

message OiMovers {
  // Largest growth first.
  repeated OiMover top_growth = 1;
  // Largest decline first (most negative change first).
  repeated OiMover top_decline = 2;
  // Resolved window, ms.
  int64 window_start_ts = 3;
  int64 window_end_ts = 4;
  reserved 5 to 9;
}

message MetricValue {
  Metric metric = 1;
  // No data (for example, no OI in the step): the value is absent.
  optional double value = 2;
}

message AggregateRow {
  // Step start, ms.
  int64 bucket_start = 1;
  // Group key: exchange, normalized symbol or base asset (per group_by).
  string group = 2;
  repeated MetricValue values = 3;
  // The step overlaps a Gap or the source is incomplete (for example Binance !forceOrder).
  bool partial = 4;
  reserved 5 to 9;
}

message AggregateResponse {
  repeated AggregateRow rows = 1;
  // At least one row is partial: the sums are a lower bound.
  bool partial = 2;
  // v0.2: set instead of rows when the request asked for the OI movers ranking.
  OiMovers oi_movers = 10;
  reserved 3 to 9;
}
