// History and aggregates. All calculations are performed by the server.
syntax = "proto3";

package vulture.v1;

import "vulture/v1/common.proto";

service History {
  // Events for a period (recent from Redis, older from ClickHouse, transparently). Pagination:
  // cursor = Event.id of the last received event, passed in HistoryRequest.cursor.
  rpc Query(HistoryRequest) returns (stream Event);
  // Aggregates by exchange, symbol or base asset with a 1m/5m/15m/1h/4h/1d/1w/1M step (v0.5 added the minute
  // steps and 4h). With AggregateRequest.oi_movers set it returns the open interest movers ranking instead.
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);
  // Profile of liquidations and OI change by hour of day and day of week over a lookback (v0.6).
  rpc Seasonality(SeasonalityRequest) returns (SeasonalityResponse);
}

message HistoryRequest {
  repeated string exchanges = 1;
  repeated string symbols = 2;
  repeated EventType types = 3;
  // Period bounds, ms, [from_ts, to_ts).
  int64 from_ts = 4;
  int64 to_ts = 5;
  // 0 = the server default limit.
  uint32 limit = 6;
  string cursor = 7;
  reserved 8 to 15;
}

enum GroupBy {
  GROUP_BY_UNSPECIFIED = 0;
  GROUP_BY_EXCHANGE = 1;
  GROUP_BY_SYMBOL = 2;
  GROUP_BY_BASE_ASSET = 3;
}

enum Step {
  STEP_UNSPECIFIED = 0;
  STEP_HOUR = 1;
  STEP_DAY = 2;
  STEP_WEEK = 3;
  STEP_MONTH = 4;
  // Added in v0.5. Bins are aligned to UTC (a day starts at 00:00 UTC, a week on Monday 00:00 UTC, a month on
  // the 1st); the minute and hour steps divide the day evenly.
  STEP_MINUTE_1 = 5;
  STEP_MINUTE_5 = 6;
  STEP_MINUTE_15 = 7;
  STEP_HOUR_4 = 8;
}

enum Metric {
  METRIC_UNSPECIFIED = 0;
  // Liquidations: USD sum and count.
  METRIC_LIQ_SUM_USD = 1;
  METRIC_LIQ_COUNT = 2;
  // Liquidations by side, USD.
  METRIC_LIQ_LONG_USD = 3;
  METRIC_LIQ_SHORT_USD = 4;
  // Largest liquidation, USD.
  METRIC_LIQ_MAX_USD = 5;
  // OI change over the step: in the base coin and in USD.
  METRIC_OI_CHANGE_BASE = 6;
  METRIC_OI_CHANGE_USD = 7;
  // Total OI per base asset (all exchanges), USD, at the end of the step.
  METRIC_OI_TOTAL_USD = 8;
  // Liquidations as a share of OI: liq_usd / oi_usd.
  METRIC_LIQ_TO_OI_RATIO = 9;
  // Added in v0.5. OI level at the end of the step (the last sample in it): base coin and USD.
  METRIC_OI_END_BASE = 10;
  METRIC_OI_END_USD = 11;
  // Mark price open/high/low/close of the step, taken from the mark prices carried by the 30-second OI samples:
  // an approximation of a candle, not exchange candles. Not defined (absent) for GROUP_BY_EXCHANGE.
  METRIC_MARK_OPEN = 12;
  METRIC_MARK_HIGH = 13;
  METRIC_MARK_LOW = 14;
  METRIC_MARK_CLOSE = 15;
  // Added in v0.6 (funding and basis, from OpenInterest.funding_rate / index_price). For a group of several series
  // the value is the mean over the series. Absent where the exchange supplies no funding rate or index price.
  // Funding rate of the last sample of the bin, and the mean over all samples of the bin (fractions).
  METRIC_FUNDING_LAST = 16;
  METRIC_FUNDING_AVG = 17;
  // Basis in percent, 100 * (mark - index) / index, at the last sample of the bin and averaged over the samples.
  METRIC_BASIS_PCT = 18;
  METRIC_BASIS_PCT_AVG = 19;
  // Added in v0.6 (analytics). The "window" of these metrics is the step. Price change: the mark price at the
  // end of the bin against the one at the end of the bin before, percent. OI change: change of oi_base over the
  // bin as a percent of the oi_base at the end of the bin before. Both are absent for GROUP_BY_EXCHANGE (they mix
  // assets) and when either end is unknown.
  METRIC_PRICE_CHANGE_PCT = 20;
  METRIC_OI_CHANGE_PCT = 21;
  // Regime from the signs of the two changes: a Regime number as the value (absent when either change is zero or
  // unknown); the strength is sqrt(|price change %| * |OI change %|).
  METRIC_REGIME = 22;
  METRIC_REGIME_STRENGTH = 23;
  // OI grows while the price does not: OI change % minus |price change %| (positive: positions build up faster
  // than the price moves).
  METRIC_OI_PRICE_FLATNESS = 24;
  // Cross-exchange divergence, GROUP_BY_BASE_ASSET only: the largest minus the smallest OI change % among the
  // exchanges that list the asset (at least two); AggregateRow.divergence names the exchanges.
  METRIC_OI_DIVERGENCE_PCT = 25;
}

// Market regime from the direction of price and open interest (METRIC_REGIME).
enum Regime {
  REGIME_UNSPECIFIED = 0;
  // Price up, OI up.
  REGIME_NEW_LONGS = 1;
  // Price down, OI up.
  REGIME_NEW_SHORTS = 2;
  // Price up, OI down.
  REGIME_SHORT_COVERING = 3;
  // Price down, OI down.
  REGIME_LONG_UNWINDING = 4;
}

// The exchanges behind METRIC_OI_DIVERGENCE_PCT.
message Divergence {
  // The exchange where OI grew the most (or fell the least) and its OI change, percent.
  string rising_exchange = 1;
  double rising_pct = 2;
  // The exchange where OI fell the most (or grew the least).
  string falling_exchange = 3;
  double falling_pct = 4;
  // rising_pct - falling_pct.
  double spread_pct = 5;
  // Exchanges compared.
  uint32 exchanges = 6;
}

message AggregateRequest {
  GroupBy group_by = 1;
  Step step = 2;
  // Period, ms, [from_ts, to_ts).
  int64 from_ts = 3;
  int64 to_ts = 4;
  // Filters; an empty list = no filter.
  repeated string exchanges = 5;
  repeated string symbols = 6;
  repeated string base_assets = 7;
  repeated Metric metrics = 8;
  // v0.2: when set, the call returns the OI movers ranking in AggregateResponse.oi_movers and no
  // rows. group_by, step and metrics are ignored; from_ts is ignored; to_ts is the end of the
  // window (0 = now); exchanges and symbols filter the candidates.
  // (Numbers 9 to 15 stay reserved: shrinking a reserved range is a breaking change.)
  optional OiMoversQuery oi_movers = 16;
  reserved 9 to 15;
}

enum OiMoverSort {
  OI_MOVER_SORT_UNSPECIFIED = 0;
  // By change in percent (default).
  OI_MOVER_SORT_PCT = 1;
  // By absolute change of oi_base.
  OI_MOVER_SORT_ABS_BASE = 2;
}

// Ranking of open interest changes (oi_base, never oi_usd, so price moves do not show as spikes).
message OiMoversQuery {
  // Window length, seconds: oi_base at (to_ts - window) is compared with oi_base at to_ts.
  uint32 window_secs = 1;
  // Entries per list; 0 = the server default.
  uint32 limit = 2;
  OiMoverSort sort_by = 3;
  // Ignore symbols whose current OI is below this many USD (noise filter); 0 = no filter.
  double min_oi_usd = 4;
  reserved 5 to 9;
  // Added in v0.5. Leave out symbols for which the window crosses a Gap or a data hole (the signal detector would
  // not evaluate them); by default they are listed with OiMover.partial set.
  bool exclude_partial = 10;
}

message OiMover {
  string exchange = 1;
  // Normalized symbol.
  string symbol = 2;
  // oi_base at the start and at the end of the window.
  double oi_base_start = 3;
  double oi_base_end = 4;
  // oi_base_end - oi_base_start, base units.
  double change_abs = 5;
  // Percent of oi_base_start.
  double change_pct = 6;
  // Current OI in USD, if known.
  optional double oi_usd_end = 7;
  // The window overlaps a Gap or has too few samples: the change is an estimate.
  bool partial = 8;
  reserved 9 to 15;
}

message OiMovers {
  // Largest growth first.
  repeated OiMover top_growth = 1;
  // Largest decline first (most negative change first).
  repeated OiMover top_decline = 2;
  // Resolved window, ms.
  int64 window_start_ts = 3;
  int64 window_end_ts = 4;
  reserved 5 to 9;
}

message MetricValue {
  Metric metric = 1;
  // No data (for example, no OI in the step): the value is absent.
  optional double value = 2;
}

message AggregateRow {
  // Step start, ms.
  int64 bucket_start = 1;
  // Group key: exchange, normalized symbol or base asset (per group_by).
  string group = 2;
  repeated MetricValue values = 3;
  // The step overlaps a Gap of a source the requested metrics depend on, or lies inside a data hole (no samples
  // while the group has data before and after). The inherent incompleteness of the Binance !forceOrder feed is
  // not flagged here: its sums are always lower bounds.
  bool partial = 4;
  reserved 5 to 9;
  // Added in v0.5. Step end (exclusive), ms; differs from bucket_start + a fixed length for week and month.
  int64 bucket_end = 10;
  // Added in v0.6. Set when METRIC_OI_DIVERGENCE_PCT is requested and the row has a value for it.
  optional Divergence divergence = 11;
}

message AggregateResponse {
  repeated AggregateRow rows = 1;
  // At least one row is partial: the sums are a lower bound.
  bool partial = 2;
  // v0.2: set instead of rows when the request asked for the OI movers ranking.
  OiMovers oi_movers = 10;
  reserved 3 to 9;
  // Added in v0.5. The aligned period the bins cover: [bins_from_ts, bins_to_ts), ms.
  int64 bins_from_ts = 11;
  int64 bins_to_ts = 12;
  // Where the data came from: "clickhouse", "redis" or "clickhouse+redis" (the unflushed tail was merged in).
  string source = 13;
}

// --- Seasonality (v0.6) ---

message SeasonalityRequest {
  // Grouping and filters as in AggregateRequest; keep the filters narrow (a profile is computed per group).
  GroupBy group_by = 1;
  repeated string exchanges = 2;
  repeated string symbols = 3;
  repeated string base_assets = 4;
  // Days looked back from to_ts, 1 to 180 (0 = 30).
  uint32 lookback_days = 5;
  // End of the lookback, ms (0 = now).
  int64 to_ts = 6;
}

message SeasonalityBucket {
  // Hour of day 0 to 23 (UTC) in by_hour; day of week 0 (Monday) to 6 in by_weekday.
  uint32 index = 1;
  // Hourly bins that went into the means.
  uint32 samples = 2;
  // Mean liquidated USD per hour, and mean OI change per hour in percent (signed, and in absolute value).
  optional double mean_liq_usd = 3;
  optional double mean_oi_change_pct = 4;
  optional double mean_abs_oi_change_pct = 5;
}

message SeasonalityProfile {
  string group = 1;
  repeated SeasonalityBucket by_hour = 2;
  repeated SeasonalityBucket by_weekday = 3;
}

message SeasonalityResponse {
  repeated SeasonalityProfile profiles = 1;
  // Distinct UTC days of the lookback with data, and the lookback asked for.
  uint32 days_covered = 2;
  uint32 lookback_days = 3;
  // Fewer days covered than asked, a weekday without observations, or a gap in the data.
  bool partial = 4;
  // The period the hourly bins covered, ms.
  int64 from_ts = 5;
  int64 to_ts = 6;
  string source = 7;
}
