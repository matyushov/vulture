// Service management. All RPCs require a token (admin is implied, there is no role in the contract).
// First version: the main operations; completeness and validation belong to epic V4.
syntax = "proto3";

package vulture.v1;

import "vulture/v1/common.proto";

service Control {
  // Subscriptions: exchanges and symbols.
  // Decision (v0.2): kept for compatibility but superseded by ListSymbolPolicies/SetSymbolPolicy,
  // which cover the same need (which symbols an exchange tracks) with explicit modes. New clients
  // should use the policy RPCs; a server may answer these two with UNIMPLEMENTED. They are not
  // removed so that no field or method number changes.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc SetSubscription(SetSubscriptionRequest) returns (SetSubscriptionResponse);
  // Tracked symbols per exchange (v0.2). Changes apply on the fly, without restart.
  rpc ListSymbolPolicies(ListSymbolPoliciesRequest) returns (ListSymbolPoliciesResponse);
  // Replaces the policy of one exchange. Idempotent: the same request gives the same state.
  // Errors: INVALID_ARGUMENT (unknown exchange, malformed or unknown symbol names, empty WHITELIST,
  // UNSPECIFIED mode), UNIMPLEMENTED (non-empty oi_intervals: per-symbol overrides are not supported yet),
  // FAILED_PRECONDITION (the exchange's symbol list is not loaded yet; retry), INTERNAL (the state could
  // not be stored; nothing changed). The change is stored before the call returns.
  rpc SetSymbolPolicy(SetSymbolPolicyRequest) returns (SetSymbolPolicyResponse);
  // Connector status.
  rpc GetConnectorStatus(GetConnectorStatusRequest) returns (GetConnectorStatusResponse);
  // OI polling interval.
  rpc SetOiInterval(SetOiIntervalRequest) returns (SetOiIntervalResponse);
  // Alert rules.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc UpsertRule(UpsertRuleRequest) returns (UpsertRuleResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // Delivery channels (Telegram, Discord); secrets are never returned.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc UpsertChannel(UpsertChannelRequest) returns (UpsertChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  // Sends a test message to one channel right away, bypassing the queue and the batching (v0.4).
  rpc SendTestMessage(SendTestMessageRequest) returns (SendTestMessageResponse);
  // Builds the daily digest now and queues it for the channels (v0.6): for testing the sections and the layout.
  // Errors: INVALID_ARGUMENT (unknown channel or section, top_n above 20), FAILED_PRECONDITION (no enabled channel
  // to send to), UNIMPLEMENTED (the alerts subsystem is off).
  rpc SendDigestNow(SendDigestNowRequest) returns (SendDigestNowResponse);
  // Redis and flusher status.
  rpc GetStorageStatus(GetStorageStatusRequest) returns (GetStorageStatusResponse);
  // Token rotation; the new token is returned once.
  rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse);
}

// --- Subscriptions ---

message Subscription {
  string exchange = 1;
  // An empty list = all symbols of the exchange.
  repeated string symbols = 2;
  bool enabled = 3;
  reserved 4 to 9;
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message SetSubscriptionRequest {
  Subscription subscription = 1;
}

message SetSubscriptionResponse {}

// --- Symbol policies (v0.2) ---

// Which symbols of an exchange are tracked.
enum SymbolMode {
  SYMBOL_MODE_UNSPECIFIED = 0;
  // Every eligible perpetual the exchange offers; symbols is ignored.
  SYMBOL_MODE_ALL = 1;
  // Only the listed symbols.
  SYMBOL_MODE_WHITELIST = 2;
  // Everything except the listed symbols.
  SYMBOL_MODE_BLACKLIST = 3;
}

// Override of the open interest poll interval for one symbol.
message SymbolOiInterval {
  // Normalized symbol (BTC-USDT-PERP).
  string symbol = 1;
  uint32 interval_seconds = 2;
}

message SymbolPolicy {
  string exchange = 1;
  SymbolMode mode = 2;
  // Normalized symbols for WHITELIST and BLACKLIST.
  repeated string symbols = 3;
  // Optional per-symbol OI poll interval overrides; other symbols use the exchange interval. The current
  // server does not support them: a non-empty list is refused with UNIMPLEMENTED.
  repeated SymbolOiInterval oi_intervals = 4;
  reserved 5 to 9;
}

message ListSymbolPoliciesRequest {
  // An empty list = all configured exchanges.
  repeated string exchanges = 1;
}

message ListSymbolPoliciesResponse {
  repeated SymbolPolicy policies = 1;
  // One entry per element of policies, same order (added in v0.3).
  repeated SymbolPolicyStatus statuses = 2;
}

// Counts for one exchange's policy (v0.3).
message SymbolPolicyStatus {
  string exchange = 1;
  // Symbols tracked under the policy (the universe filtered by the mode and the list).
  uint32 tracked_count = 2;
  // Symbols the exchange offers (linear USDT/USDC perpetuals). 0 until the server has loaded the list.
  uint32 universe_size = 3;
  // False until the server has loaded the exchange's symbol list; names cannot be validated before.
  bool universe_loaded = 4;
  // True when the policy was set through SetSymbolPolicy (stored on the server), false when it is the
  // default from the server configuration.
  bool overridden = 5;
  reserved 6 to 9;
}

message SetSymbolPolicyRequest {
  SymbolPolicy policy = 1;
}

message SetSymbolPolicyResponse {
  // The policy as stored after validation and normalization (names upper-cased, duplicates removed; the
  // list is empty for ALL).
  SymbolPolicy policy = 1;
  // Fields below were added in v0.3.
  // Symbols tracked after the change.
  uint32 tracked_count = 2;
  // Symbols the exchange offers.
  uint32 universe_size = 3;
  // Difference of the tracked sets, sorted: started to be tracked / stopped being tracked.
  repeated string added = 4;
  repeated string removed = 5;
  // False when the request repeated the policy already in force (idempotent repeat).
  bool changed = 6;
  reserved 7 to 9;
}

// --- Connectors ---

enum ConnectorState {
  CONNECTOR_STATE_UNSPECIFIED = 0;
  CONNECTOR_STATE_CONNECTING = 1;
  CONNECTOR_STATE_RUNNING = 2;
  CONNECTOR_STATE_BACKOFF = 3;
  CONNECTOR_STATE_STOPPED = 4;
}

message ConnectorStatus {
  string exchange = 1;
  ConnectorState state = 2;
  // Time of the last event, ms.
  int64 last_event_ts = 3;
  // Receive lag relative to exchange time, ms.
  int64 lag_ms = 4;
  reserved 5 to 9;
}

message GetConnectorStatusRequest {}

message GetConnectorStatusResponse {
  repeated ConnectorStatus connectors = 1;
}

// --- OI interval ---

message SetOiIntervalRequest {
  string exchange = 1;
  uint32 interval_seconds = 2;
}

message SetOiIntervalResponse {}

// --- Rules ---

message LiquidationRule {
  double min_notional_usd = 1;
  // Liquidated side filter (added in v0.4); an empty list = both sides.
  repeated Side sides = 2;
}

// Direct OI rule: |change of oi_base| over the window reaches min_change_pct (both directions).
message OiChangeRule {
  double min_change_pct = 1;
  uint32 window_seconds = 2;
  // Added in v0.4. Minimum absolute change in USD (change of oi_base times the mark price); 0 = no floor.
  double min_change_usd = 3;
  // Added in v0.4. When true the rule sends no message: it overrides the thresholds of the OI spike detector
  // (min_change_pct and min_change_usd) for the window and for the exchanges/symbols the rule filters on.
  bool detector_override = 4;
}

// Signal pass-through (added in v0.4): forwards the server's own signals to the channels.
message SignalRule {
  // An empty list = every signal type.
  repeated SignalType types = 1;
  // Signals below this severity are not forwarded; UNSPECIFIED = no minimum.
  Severity min_severity = 2;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_CRITICAL = 3;
}

// What a condition of a composite rule measures (v0.6).
enum CompositeMetric {
  COMPOSITE_METRIC_UNSPECIFIED = 0;
  // Change of oi_base over window_seconds, percent (the OI spike detector's own function).
  COMPOSITE_METRIC_OI_CHANGE_PCT = 1;
  // Change of the mark price over window_seconds, percent.
  COMPOSITE_METRIC_PRICE_CHANGE_PCT = 2;
  // The latest funding rate, a fraction (0.0001 = 0.01%); window_seconds must be 0.
  COMPOSITE_METRIC_FUNDING_RATE = 3;
  // The latest basis, 100 * (mark - index) / index, percent; window_seconds must be 0.
  COMPOSITE_METRIC_BASIS_PCT = 4;
  // Liquidated USD of the symbol over window_seconds.
  COMPOSITE_METRIC_LIQ_USD = 5;
  // The regime over window_seconds, compared with EQ to a Regime number (1 new longs, 2 new shorts, 3 short
  // covering, 4 long unwinding).
  COMPOSITE_METRIC_REGIME = 6;
}

enum CompareOp {
  COMPARE_OP_UNSPECIFIED = 0;
  COMPARE_OP_GT = 1;
  COMPARE_OP_GE = 2;
  COMPARE_OP_LT = 3;
  COMPARE_OP_LE = 4;
  // Only for COMPOSITE_METRIC_REGIME.
  COMPARE_OP_EQ = 5;
}

message CompositeCondition {
  CompositeMetric metric = 1;
  CompareOp op = 2;
  double threshold = 3;
  // 30 to 14400 for the windowed metrics, 0 for funding rate and basis.
  uint32 window_seconds = 4;
}

// Composite rule (v0.6): all conditions hold at once for a symbol (AND). Scope is Rule.exchanges / Rule.symbols
// (empty = all), the cooldown is Rule.cooldown_seconds per exchange and symbol. The server evaluates composite
// rules on a fixed cadence (alerts.composite_eval_secs, default 10 s) from the engine state, not per event.
message CompositeRule {
  // 1 to 8 conditions.
  repeated CompositeCondition conditions = 1;
  // SEVERITY_UNSPECIFIED = info.
  Severity severity = 2;
}

// A range of the day in UTC (v0.6). Minutes since 00:00 UTC; end is exclusive; start > end wraps midnight.
message QuietRange {
  // 0 to 1439.
  uint32 start_minute = 1;
  // 0 to 1440; must differ from start_minute.
  uint32 end_minute = 2;
}

message GapRule {
  int64 min_duration_ms = 1;
}

message Rule {
  // Empty on creation: the server assigns the id.
  string id = 1;
  string name = 2;
  bool enabled = 3;
  oneof kind {
    LiquidationRule liquidation = 10;
    OiChangeRule oi_change = 11;
    GapRule gap = 12;
    // Added in v0.4.
    SignalRule signal = 13;
    // Added in v0.6.
    CompositeRule composite = 14;
  }
  // Filters; an empty list = no filter.
  repeated string exchanges = 4;
  repeated string symbols = 5;
  repeated string channel_ids = 6;
  uint32 cooldown_seconds = 7;
  reserved 8, 9;
  // Added in v0.6. UTC ranges in which the rule stays silent (no alert, cooldown not consumed). At most 8.
  repeated QuietRange quiet_hours = 15;
}

message ListRulesRequest {}

message ListRulesResponse {
  repeated Rule rules = 1;
}

message UpsertRuleRequest {
  Rule rule = 1;
}

message UpsertRuleResponse {
  Rule rule = 1;
}

message DeleteRuleRequest {
  string id = 1;
}

message DeleteRuleResponse {}

// --- Channels ---

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_TELEGRAM = 1;
  CHANNEL_KIND_DISCORD = 2;
}

message Channel {
  string id = 1;
  string name = 2;
  ChannelKind kind = 3;
  bool enabled = 4;
  // For system alerts.
  bool system = 5;
  // Responses only: a secret mask, for example "****abcd". The secret itself is never returned.
  string secret_mask = 6;
  reserved 7 to 9;
  // Fields below were added in v0.4.
  // Telegram: the chat id (or @channel name). Not a secret. Empty for Discord.
  string chat_id = 10;
  // Log the messages instead of sending them.
  bool dry_run = 11;
  // Where the secret comes from when it is not stored in alerts.json: a file or an environment variable on
  // the server. Responses only report them; at most one of secret, secret_file, secret_env is set per channel.
  string secret_file = 12;
  string secret_env = 13;
  // Delivery tuning; 0 = the server default for the channel kind.
  uint32 min_interval_ms = 14;
  uint32 batch_window_ms = 15;
  uint32 queue_limit = 16;
  // Added in v0.6. UTC ranges in which the channel receives no alerts (dropped, not delayed). The daily digest is
  // not affected. At most 8.
  repeated QuietRange quiet_hours = 17;
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message UpsertChannelRequest {
  Channel channel = 1;
  // Request only: a bot token or webhook URL; empty = keep the current one.
  string secret = 2;
}

message UpsertChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string id = 1;
}

message DeleteChannelResponse {}

message SendTestMessageRequest {
  string channel_id = 1;
}

message SendTestMessageResponse {
  // The platform accepted the message (always false in dry-run mode).
  bool delivered = 1;
  // The channel is in dry-run mode: the message was only logged.
  bool dry_run = 2;
  // Short outcome without secrets, for example "ok", "HTTP 401" or "dry run".
  string detail = 3;
}

// --- Daily digest (v0.6) ---

message SendDigestNowRequest {
  // Channels to send to; empty = the channels of [alerts.digest] (every enabled non-system channel if none).
  repeated string channel_ids = 1;
  // Sections: oi_movers, liquidations, skew, cascades, funding, gaps; empty = the configured ones.
  repeated string sections = 2;
  // Entries per list, 1 to 20; 0 = the configured value.
  uint32 top_n = 3;
}

message SendDigestNowResponse {
  // Channels the digest was queued for (delivery is asynchronous and follows the channel's rate limits and dry_run).
  repeated string queued_channel_ids = 1;
  // The report as plain text.
  string preview = 2;
  // Time spent building it, ms.
  uint32 build_ms = 3;
  // Sections that could not be built (listed in the report under "Not available").
  repeated string unavailable_sections = 4;
}

// --- Storage ---

message GetStorageStatusRequest {}

message GetStorageStatusResponse {
  // Redis: used memory and limit, bytes.
  uint64 redis_used_bytes = 1;
  uint64 redis_max_bytes = 2;
  // Stream lengths by name.
  map<string, uint64> stream_lengths = 3;
  // Flusher: watermark (Event.id) and lag, ms.
  string flusher_watermark = 4;
  int64 flusher_lag_ms = 5;
  reserved 6 to 15;
}

// --- Token ---

message RotateTokenRequest {}

message RotateTokenResponse {
  // Shown once; the server stores only the hash.
  string new_token = 1;
}
