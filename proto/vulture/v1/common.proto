// Common types of the vulture.v1 contract.
//
// Evolution rules: fields may only be added; numbers are not reused; a removed field or
// enum value is marked `reserved` (number and name). A user role is not introduced in the contract
// (there is a single user, admin is implied); reserved numbers are left for extension.
//
// Units: all timestamps are int64, Unix epoch milliseconds (UTC). Numbers are double.
syntax = "proto3";

package vulture.v1;

// Side of the liquidated position.
enum Side {
  SIDE_UNSPECIFIED = 0;
  // A long position was liquidated (forced sale).
  SIDE_LONG = 1;
  // A short position was liquidated (forced purchase).
  SIDE_SHORT = 2;
}

// Event type, for filters.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_LIQUIDATION = 1;
  EVENT_TYPE_OPEN_INTEREST = 2;
  EVENT_TYPE_GAP = 3;
  // Added in v0.2.
  EVENT_TYPE_SIGNAL = 4;
}

// Kind of a server-side signal (see Signal).
enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  // Open interest (oi_base) rose by more than the threshold within the window.
  SIGNAL_TYPE_OI_SPIKE_UP = 1;
  // Open interest (oi_base) fell by more than the threshold within the window.
  SIGNAL_TYPE_OI_SPIKE_DOWN = 2;
  // A liquidation cascade: liquidation intensity far above the baseline.
  SIGNAL_TYPE_LIQ_CASCADE = 3;
}

// Liquidation. The exchange is a string from the server configuration (for example "binance"), not an enum.
message Liquidation {
  string exchange = 1;
  // Symbol as the exchange returns it (BTCUSDT).
  string symbol_raw = 2;
  // Normalized symbol BASE-QUOTE-PERP (BTC-USDT-PERP).
  string symbol = 3;
  // Event time on the exchange, ms.
  int64 exchange_ts = 4;
  // Time received by the server, ms.
  int64 recv_ts = 5;
  Side side = 6;
  double price = 7;
  // Quantity in the base coin.
  double qty = 8;
  // Notional in USD (price * qty, taking the contract multiplier into account).
  double notional_usd = 9;
  reserved 10 to 15;
}

// Open interest snapshot.
message OpenInterest {
  string exchange = 1;
  string symbol_raw = 2;
  string symbol = 3;
  int64 exchange_ts = 4;
  int64 recv_ts = 5;
  // OI in the base coin.
  double oi_base = 6;
  // OI in USD, if the exchange provides it.
  optional double oi_usd = 7;
  // Mark price at the time of the snapshot, if known.
  optional double mark_price = 8;
  reserved 9 to 15;
}

// Source interruption: data in the interval [from_ts, to_ts] is incomplete.
message Gap {
  string exchange = 1;
  // Stream name within the exchange (for example "liquidations", "open_interest").
  string stream = 2;
  // Last event received before the interruption, ms.
  int64 from_ts = 3;
  // Recovery time, ms.
  int64 to_ts = 4;
  reserved 5 to 9;
}

// A signal produced by the server (alert engine), published into the same stream as raw events.
// Added in v0.2.
message Signal {
  SignalType type = 1;
  // Exchange name; "*" when the signal spans several exchanges (for example a cascade).
  string exchange = 2;
  // Normalized symbol; empty when the signal is not tied to one symbol (cascades).
  string symbol = 3;
  // Length of the observation window, seconds.
  uint32 window_secs = 4;
  // Change of oi_base over the window, percent (negative for a fall). For LIQ_CASCADE: intensity
  // relative to the baseline, percent.
  double change_pct = 5;
  // Change of oi_base over the window in base units (negative for a fall). For LIQ_CASCADE: the
  // liquidated notional in USD.
  double change_abs = 6;
  // The threshold that was crossed, in the unit of change_pct.
  double threshold = 7;
  // Time the signal fired, ms.
  int64 ts = 8;
  // Free-form details, mainly for cascades (for example "symbols", "peak_usd_per_min", "price_low",
  // "price_high"). Keys and values are informational and may grow; clients must ignore unknown keys.
  map<string, string> details = 9;
  reserved 10 to 15;
}

// Event wrapper.
message Event {
  // Redis Stream entry identifier assigned by the server; for resume (Stream.Subscribe)
  // and the cursor (History.Query). An opaque string to the client; the server compares order.
  string id = 1;
  oneof payload {
    Liquidation liquidation = 10;
    OpenInterest open_interest = 11;
    Gap gap = 12;
    // Added in v0.2.
    Signal signal = 13;
  }
  reserved 2 to 9;
}
