// Живой поток событий.
syntax = "proto3";

package vulture.v1;

import "vulture/v1/common.proto";

service Stream {
  // Живой поток ликвидаций, OI и Gap. Если задан resume_from, сначала отдаётся пропущенное
  // (из Redis), затем live. Слишком старый resume_from -> FAILED_PRECONDITION (используйте
  // History). Медленный клиент отключается с RESOURCE_EXHAUSTED.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {
  // Пустой список = без фильтра по полю.
  repeated string exchanges = 1;
  // Нормализованные символы (BTC-USDT-PERP).
  repeated string symbols = 2;
  repeated EventType types = 3;
  // Event.id последнего полученного события.
  string resume_from = 4;
  reserved 5 to 15;
}
