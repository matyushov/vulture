[workspace]
resolver = "3"
members = ["crates/vulture-proto", "crates/vulture-server", "crates/vulture-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/matyushov/vulture"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"
rand = "0.10"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "streams", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "1.1"
webpki-roots = "1.0"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
vulture-proto = { path = "crates/vulture-proto", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
