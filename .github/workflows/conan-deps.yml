name: conan-deps (update third-party dependencies in Nexus)

# Third-party UI dependencies (grpc, protobuf, ...) are built once here and uploaded
# to Nexus; ui.yml only downloads them. Dependencies change on a dedicated
# `vendor/*` branch, so develop never races a dependency change against its build:
#
#   1. git checkout -b vendor/<what>         # e.g. vendor/grpc-1.85
#   2. edit ui/conanfile.py, regenerate ui/conan.lock, push
#      -> this workflow builds whatever Nexus lacks and uploads it
#   3. open a PR vendor/<what> -> develop    # ui.yml downloads everything
#
# Builds only what is missing (--build=missing); uploads are idempotent. Manual
# dispatch with `rebuild_all` rebuilds everything from source.
# Needs secrets NEXUS_USERNAME / NEXUS_PASSWORD (write user) in the `nexus` environment.
on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every dependency from source (--build="*")
        type: boolean
        default: false
  push:
    branches:
      - 'vendor/**'

permissions:
  contents: read

env:
  BUILD_POLICY: ${{ inputs.rebuild_all && '*' || 'missing' }}

jobs:
  deps:
    name: deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    environment: nexus
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-x86_64
          - os: macos-15
            profile: macos-armv8
          - os: windows-2022
            profile: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # setup-conan tolerates empty credentials (fine for read-only builds), but this
      # workflow uploads, so a missing secret must stop it here.
      - name: Require the Nexus write credentials
        shell: bash
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "$NEXUS_USER" ] || [ -z "$NEXUS_PASS" ]; then
            echo "::error::NEXUS_USERNAME / NEXUS_PASSWORD are not set in the 'nexus' environment (Settings -> Environments -> nexus -> Environment secrets)"
            exit 1
          fi

      - name: Pin the compiler (gcc-13)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-13 g++-13
          gcc-13 --version | head -1

      # The profile pins compiler.version; if the runner image changes, this output
      # shows the real versions to compare against ui/conan/profiles/*.
      - name: Print the toolchain versions
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) xcode-select -p; clang --version | head -1 ;;
            Windows) "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property catalog_productDisplayVersion || true ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Restore the conan cache (partial progress of earlier runs)
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-deps-${{ matrix.profile }}-${{ hashFiles('ui/conan.lock', 'ui/conanfile.py', 'ui/conan/profiles/*') }}-${{ github.run_id }}
          restore-keys: conan-deps-${{ matrix.profile }}-${{ hashFiles('ui/conan.lock', 'ui/conanfile.py', 'ui/conan/profiles/*') }}-

      - name: Build the dependency graph
        shell: bash
        run: conan install ui -pr:a ui/conan/profiles/${{ matrix.profile }} --lockfile=ui/conan.lock --build="$BUILD_POLICY"

      # always(): a timeout or failure later in the graph must not lose what is built.
      - name: Save the conan cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-deps-${{ matrix.profile }}-${{ hashFiles('ui/conan.lock', 'ui/conanfile.py', 'ui/conan/profiles/*') }}-${{ github.run_id }}

      - name: Upload binaries to Nexus
        shell: bash
        run: conan upload "*" -r nexus-local --confirm
