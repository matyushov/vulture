# CI: Rust, supply chain, secrets, proto. The UI build is a separate workflow, ui.yml.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Throwaway Redis for the storage integration tests (crates/vulture-server/tests/redis_store.rs).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VULTURE_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The image builds (nothing is pushed) and the compose file validates with the template environment.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker compose config
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example --profile clickhouse config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml --env-file deploy/.env.example config -q
      - name: Toolchain pin matches the Dockerfile
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          docker=$(sed -n 's/^ARG RUST_VERSION=//p' Dockerfile)
          test -n "$pinned" && test "$pinned" = "$docker" || { echo "rust-toolchain.toml ($pinned) and Dockerfile ($docker) differ"; exit 1; }
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vulture-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The binary runs in the image
        run: docker run --rm vulture-server:ci --version

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the CLI directly over the whole history: on push, gitleaks-action computes the range
      # <first commit>^..HEAD and fails on the root commit, which has no parent.
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks detect
        run: gitleaks detect --source . --redact -v --exit-code 1

  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf breaking
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            echo "no base revision, skipping buf breaking"; exit 0
          fi
          # Bootstrap: while the base has no first version of the contract (common.proto),
          # there is nothing to compare against. Remove this check after the first merge of F-3 into develop.
          if ! git cat-file -e "$base:proto/vulture/v1/common.proto" 2>/dev/null; then
            echo "base has no contract v0 yet, skipping buf breaking"; exit 0
          fi
          cd proto
          buf breaking --against "../.git#ref=$base,subdir=proto"
