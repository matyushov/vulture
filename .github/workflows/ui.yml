# Сборка vulture-ui (Qt6 + conan). Отдельный workflow: не блокирует Rust-задания ci.yml.
name: ui

on:
  push:
    branches: [develop, main]
    paths: ["ui/**", "proto/**", ".github/workflows/ui.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["ui/**", "proto/**", ".github/workflows/ui.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6, последняя доступная ветка; при смене править только здесь.
  QT_VERSION: "6.9.*"

jobs:
  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # grpc из исходников долгий; с кэшем conan и Nexus укладывается заметно быстрее.
    timeout-minutes: 90
    env:
      # Пусто для форков и пока секреты не заданы: тогда используется conan-center.
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-x86_64
            qt_arch: ""
          - os: macos-15
            profile: macos-armv8
            qt_arch: ""
          - os: windows-2022
            profile: windows-x86_64
            qt_arch: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "conan>=2,<3"

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.profile }}-${{ hashFiles('ui/conanfile.py', 'ui/conan/profiles/*') }}
          restore-keys: conan-${{ matrix.profile }}-

      - name: Conan remote (Nexus, if configured)
        if: env.NEXUS_URL != ''
        shell: bash
        run: |
          conan remote add nexus "$NEXUS_URL" --index 0
          conan remote login nexus "$NEXUS_USER" -p "$NEXUS_PASSWORD"

      - name: Conan install
        shell: bash
        run: >
          conan install ui
          -pr:h ui/conan/profiles/${{ matrix.profile }}
          -pr:b ui/conan/profiles/${{ matrix.profile }}
          -o '&:require_qt=True'
          --build=missing

      - name: Build
        shell: bash
        run: >
          conan build ui
          -pr:h ui/conan/profiles/${{ matrix.profile }}
          -pr:b ui/conan/profiles/${{ matrix.profile }}
          -o '&:require_qt=True'
