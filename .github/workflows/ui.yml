# vulture-ui build (Qt6 + conan). A separate workflow: does not block the Rust jobs of ci.yml.
name: ui

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths: ["ui/**", "proto/**", ".github/workflows/ui.yml"]
  pull_request:
    branches: [develop, main]
    paths: ["ui/**", "proto/**", ".github/workflows/ui.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 6, latest available branch; when changing it, edit only here.
  QT_VERSION: "6.12.*"

jobs:
  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Dependencies are taken prebuilt from Nexus (conan-deps.yml builds them). Without read-only
    # secrets (forks) building grpc from source is slow, so the limit is large.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-x86_64
            qt_arch: ""
          - os: macos-15
            profile: macos-armv8
            qt_arch: ""
          - os: windows-2022
            profile: windows-x86_64
            qt_arch: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Read-only Nexus user (repository secrets). Empty: forks and PRs without secrets
      # use conan-center.
      - name: Set up Conan
        uses: ./.github/actions/setup-conan
        with:
          username: ${{ secrets.NEXUS_RO_USERNAME }}
          password: ${{ secrets.NEXUS_RO_PASSWORD }}

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.profile }}-${{ hashFiles('ui/conan.lock', 'ui/conanfile.py', 'ui/conan/profiles/*') }}
          restore-keys: conan-${{ matrix.profile }}-

      # The profile + conan.lock yield the same package_id values that conan-deps.yml uploaded.
      - name: Conan install
        shell: bash
        run: >
          conan install ui
          -pr:a ui/conan/profiles/${{ matrix.profile }}
          --lockfile=ui/conan.lock
          -o '&:require_qt=True'
          --build=missing

      - name: Build
        shell: bash
        run: >
          conan build ui
          -pr:a ui/conan/profiles/${{ matrix.profile }}
          --lockfile=ui/conan.lock
          -o '&:require_qt=True'
